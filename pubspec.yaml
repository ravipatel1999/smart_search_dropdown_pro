name: smart_search_dropdown_pro
description: A powerful Flutter searchable dropdown supporting autocomplete, multi-select, async API search, infinite scroll, grouping, icons, status tags, dark mode, and responsive UI.
version: 1.0.8

homepage: https://github.com/ravipatel1999/smart_search_dropdown_pro
repository: https://github.com/ravipatel1999/smart_search_dropdown_pro
issue_tracker: https://github.com/ravipatel1999/smart_search_dropdown_pro/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - flutter
  - dropdown
  - searchable-dropdown
  - multi-select
  - autocomplete